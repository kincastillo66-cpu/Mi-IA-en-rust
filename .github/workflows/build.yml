name: Crear APK con Rust
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar herramientas C++
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Configurar NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Preparar proyecto Flutter
        run: flutter create . --project-name mi_ia_rust

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar Rust (64 y 32 bits)
        run: |
          cd rust_brain
          cargo ndk -t arm64-v8a -t armeabi-v7a build --release

      - name: Copiar Cerebro a Android
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp rust_brain/target/aarch64-linux-android/release/librust_brain.so android/app/src/main/jniLibs/arm64-v8a/
          
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp rust_brain/target/armv7-linux-androideabi/release/librust_brain.so android/app/src/main/jniLibs/armeabi-v7a/
          
          echo "Verificando archivos:"
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          ls -la android/app/src/main/jniLibs/armeabi-v7a/

      - name: Compilar APK Final
        run: flutter build apk --release
        
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk